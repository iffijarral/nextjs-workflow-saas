stages:
  - lint
  - audit
  - security
  - build
  - deploy

variables:
  APP_IMAGE: $CI_REGISTRY_IMAGE:latest
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""

lint:
  stage: lint
  image: node:20
  script:
    - npm install -g pnpm
    - pnpm install
    - npx prettier --check .
    - npx eslint .
  only:
    - main

audit:
  stage: audit
  image: node:20
  script:
    - npm install -g pnpm
    - pnpm install --frozen-lockfile
    - npm audit --production --audit-level=high
  only:
    - main

security:
  stage: security
  image: owasp/dependency-check
  variables:
    OWASP_OUTPUT_DIR: "owasp-reports/$CI_PIPELINE_ID"
  script:
    - mkdir -p $OWASP_OUTPUT_DIR
    - dependency-check.sh --project bizflow --out $OWASP_OUTPUT_DIR --scan .
  artifacts:
    paths:
      - $OWASP_OUTPUT_DIR
    expire_in: 60 days
  only:
    - main

build-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - docker build --pull -t $APP_IMAGE .
    - docker push $APP_IMAGE
  only:
    - main
  needs:
    - lint
    - audit
    - security

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-cli-compose
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd $WORK_DIR &&

        # Export env vars for docker-compose
        export POSTGRES_USER='$POSTGRES_USER'
        export POSTGRES_PASSWORD='$POSTGRES_PASSWORD'
        export POSTGRES_DB='$POSTGRES_DB'
        export DATABASE_URL='$DATABASE_URL'
        export AUTH_SECRET='$AUTH_SECRET'
        export NEXTAUTH_SECRET='$NEXTAUTH_SECRET'
        export AUTH_TRUST_HOST=true
        export RESEND_API_KEY='$RESEND_API_KEY'
        export APP_IMAGE='$APP_IMAGE'
        export NODE_ENV='production'

        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker-compose pull &&
        docker-compose down &&
        docker-compose up -d
      "
  only:
    - main
  needs:
    - build-image
